<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pop Rush</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }

      #game-root {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>

    <script src="https://www.youtube.com/game_api/v1"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script>
      function safeFirstFrameReady() {
        if (
          window.ytgame &&
          ytgame.game &&
          typeof ytgame.game.firstFrameReady === 'function'
        ) {
          ytgame.game.firstFrameReady();
        }
      }

      function safeGameReady() {
        if (
          window.ytgame &&
          ytgame.game &&
          typeof ytgame.game.gameReady === 'function'
        ) {
          ytgame.game.gameReady();
        }
      }

      function safeSendScore(score) {
        if (
          window.ytgame &&
          ytgame.engagement &&
          typeof ytgame.engagement.sendScore === 'function'
        ) {
          ytgame.engagement.sendScore(score);
        }
      }

      async function safeCloudLoadBestScore() {
        if (window.ytgame && ytgame.game && typeof ytgame.game.loadData === 'function') {
          try {
            const result = ytgame.game.loadData('pop_rush_best_score');
            const data = result && typeof result.then === 'function' ? await result : result;

            if (typeof data === 'number') {
              return Math.max(0, Math.floor(data));
            }

            if (data && typeof data === 'object') {
              const val = data.pop_rush_best_score ?? data.bestScore;
              if (typeof val === 'number' && Number.isFinite(val)) {
                return Math.max(0, Math.floor(val));
              }
            }
          } catch (error) {
            // Fall back to local storage below.
          }
        }

        const local = localStorage.getItem('pop_rush_best_score');
        const parsed = Number(local);
        if (!Number.isFinite(parsed) || parsed < 0) {
          return 0;
        }
        return Math.floor(parsed);
      }

      async function safeCloudSaveBestScore(bestScore) {
        localStorage.setItem('pop_rush_best_score', String(bestScore));

        if (window.ytgame && ytgame.game && typeof ytgame.game.saveData === 'function') {
          try {
            const result = ytgame.game.saveData('pop_rush_best_score', bestScore);
            if (result && typeof result.then === 'function') {
              await result;
            }
          } catch (error) {
            // Local storage fallback is already written.
          }
        }
      }

      function safeIsAudioEnabled() {
        if (
          window.ytgame &&
          ytgame.system &&
          typeof ytgame.system.isAudioEnabled === 'function'
        ) {
          return !!ytgame.system.isAudioEnabled();
        }
        return true;
      }

      function safeOnAudioEnabledChange(callback) {
        if (
          window.ytgame &&
          ytgame.system &&
          typeof ytgame.system.onAudioEnabledChange === 'function'
        ) {
          ytgame.system.onAudioEnabledChange(callback);
        }
      }

      function safeOnPause(callback) {
        if (window.ytgame && ytgame.game && typeof ytgame.game.onPause === 'function') {
          ytgame.game.onPause(callback);
        }
      }

      function safeOnResume(callback) {
        if (window.ytgame && ytgame.game && typeof ytgame.game.onResume === 'function') {
          ytgame.game.onResume(callback);
        }
      }

      class BootScene extends Phaser.Scene {
        constructor() {
          super('BootScene');
        }

        create() {
          safeFirstFrameReady();

          const centerX = this.cameras.main.width / 2;
          const centerY = this.cameras.main.height / 2;
          const barWidth = 280;
          const barHeight = 22;

          const barBg = this.add.graphics();
          barBg.fillStyle(0x272727, 1);
          barBg.fillRoundedRect(
            centerX - barWidth / 2,
            centerY - barHeight / 2,
            barWidth,
            barHeight,
            10
          );

          const barFill = this.add.graphics();
          const progress = { value: 0 };

          const drawFill = () => {
            barFill.clear();
            barFill.fillStyle(0x55d6ff, 1);
            barFill.fillRoundedRect(
              centerX - barWidth / 2 + 3,
              centerY - barHeight / 2 + 3,
              (barWidth - 6) * progress.value,
              barHeight - 6,
              8
            );
          };

          drawFill();

          this.tweens.add({
            targets: progress,
            value: 1,
            duration: 1000,
            ease: 'Linear',
            onUpdate: drawFill,
            onComplete: () => {
              this.scene.start('UIScene');
            }
          });
        }
      }

      const BUBBLE_TYPES = {
        NORMAL: { key: 'NORMAL', color: 0x3b82f6, radius: 30, points: 10 },
        SMALL: { key: 'SMALL', color: 0x22d3ee, radius: 18, points: 25 },
        SPLITTER: { key: 'SPLITTER', color: 0x22c55e, radius: 35, points: 5 },
        BOMB: { key: 'BOMB', color: 0xef4444, radius: 28, points: 0 }
      };

      const PLAY_WIDTH = 480;
      const PLAY_HEIGHT = 640;
      const EDGE_PADDING = 40;
      const HUD_SAFE_TOP = 108;
      const BUBBLE_POOL_SIZE = 30;
      const MAX_ACTIVE_BUBBLES = 25;

      const PROFILE_STORAGE_KEY = 'pop_rush_profile';

      const SKIN_THEMES = {
        classic: {
          name: 'Classic',
          colors: {
            NORMAL: 0x3b82f6,
            SMALL: 0x22d3ee,
            SPLITTER: 0x22c55e,
            BOMB: 0xef4444
          }
        },
        neon: {
          name: 'Neon',
          colors: {
            NORMAL: 0xa855f7,
            SMALL: 0x06b6d4,
            SPLITTER: 0x84cc16,
            BOMB: 0xef4444
          }
        },
        sunset: {
          name: 'Sunset',
          colors: {
            NORMAL: 0xf97316,
            SMALL: 0xf59e0b,
            SPLITTER: 0xeab308,
            BOMB: 0xef4444
          }
        },
        glacier: {
          name: 'Glacier',
          colors: {
            NORMAL: 0x60a5fa,
            SMALL: 0x93c5fd,
            SPLITTER: 0x67e8f9,
            BOMB: 0xef4444
          }
        }
      };

      const SKIN_KEY_ALIASES = {
        skinNeon: 'neon',
        skinSunset: 'sunset',
        skinGlacier: 'glacier'
      };

      function normalizeSkinKey(skin) {
        if (typeof skin !== 'string') {
          return 'classic';
        }

        if (SKIN_THEMES[skin]) {
          return skin;
        }

        if (SKIN_KEY_ALIASES[skin]) {
          return SKIN_KEY_ALIASES[skin];
        }

        return 'classic';
      }

      const SHOP_ITEMS = {
        skinNeon: { key: 'skinNeon', type: 'skin', value: 'neon', label: 'Neon Skin', cost: 80 },
        skinSunset: {
          key: 'skinSunset',
          type: 'skin',
          value: 'sunset',
          label: 'Sunset Skin',
          cost: 140
        },
        skinGlacier: {
          key: 'skinGlacier',
          type: 'skin',
          value: 'glacier',
          label: 'Glacier Skin',
          cost: 220
        },
        hatCrown: {
          key: 'hatCrown',
          type: 'hat',
          value: 'crown',
          label: 'Crown Hat',
          cost: 120
        },
        hatHalo: { key: 'hatHalo', type: 'hat', value: 'halo', label: 'Halo Hat', cost: 160 },
        hatPropeller: {
          key: 'hatPropeller',
          type: 'hat',
          value: 'propeller',
          label: 'Propeller Hat',
          cost: 240
        },
        slowTime: {
          key: 'slowTime',
          type: 'upgrade',
          value: 'slowTime',
          label: 'Slow Time',
          cost: 200
        },
        bonusPoints: {
          key: 'bonusPoints',
          type: 'upgrade',
          value: 'bonusPoints',
          label: 'Bonus Points',
          cost: 220
        },
        coinEngine: {
          key: 'coinEngine',
          type: 'repeatable',
          value: 'coinEngine',
          label: 'Coin Engine',
          baseCost: 140,
          growth: 1.45
        },
        scoreAmp: {
          key: 'scoreAmp',
          type: 'repeatable',
          value: 'scoreAmp',
          label: 'Score Amp',
          baseCost: 160,
          growth: 1.42
        },
        timeWarp: {
          key: 'timeWarp',
          type: 'repeatable',
          value: 'timeWarp',
          label: 'Time Warp',
          baseCost: 190,
          growth: 1.5
        }
      };

      function createDefaultProfile() {
        return {
          coins: 0,
          ownedSkins: ['classic'],
          equippedSkin: 'classic',
          ownedHats: ['none'],
          equippedHat: 'none',
          upgrades: {
            slowTime: false,
            bonusPoints: false
          },
          repeatables: {
            coinEngine: 0,
            scoreAmp: 0,
            timeWarp: 0
          }
        };
      }

      function normalizeProfile(raw) {
        const base = createDefaultProfile();
        const source = raw && typeof raw === 'object' ? raw : {};

        const coins = Number(source.coins);
        base.coins = Number.isFinite(coins) && coins > 0 ? Math.floor(coins) : 0;

        if (Array.isArray(source.ownedSkins)) {
          const validSkins = source.ownedSkins
            .map((skin) => normalizeSkinKey(skin))
            .filter((skin) => !!SKIN_THEMES[skin]);
          base.ownedSkins = Array.from(new Set(['classic'].concat(validSkins)));
        }

        if (Array.isArray(source.ownedHats)) {
          const validHats = source.ownedHats.filter(
            (hat) => hat === 'none' || hat === 'crown' || hat === 'halo' || hat === 'propeller'
          );
          base.ownedHats = Array.from(new Set(['none'].concat(validHats)));
        }

        const normalizedEquippedSkin = normalizeSkinKey(source.equippedSkin);
        if (base.ownedSkins.includes(normalizedEquippedSkin)) {
          base.equippedSkin = normalizedEquippedSkin;
        }

        if (typeof source.equippedHat === 'string' && base.ownedHats.includes(source.equippedHat)) {
          base.equippedHat = source.equippedHat;
        }

        if (source.upgrades && typeof source.upgrades === 'object') {
          base.upgrades.slowTime = !!source.upgrades.slowTime;
          base.upgrades.bonusPoints = !!source.upgrades.bonusPoints;
        }

        if (source.repeatables && typeof source.repeatables === 'object') {
          const keys = Object.keys(base.repeatables);
          for (let i = 0; i < keys.length; i += 1) {
            const key = keys[i];
            const level = Number(source.repeatables[key]);
            base.repeatables[key] = Number.isFinite(level) && level > 0 ? Math.floor(level) : 0;
          }
        }

        return base;
      }

      async function safeCloudLoadProfile() {
        if (window.ytgame && ytgame.game && typeof ytgame.game.loadData === 'function') {
          try {
            const result = ytgame.game.loadData(PROFILE_STORAGE_KEY);
            const data = result && typeof result.then === 'function' ? await result : result;
            if (data && typeof data === 'object') {
              return normalizeProfile(data);
            }
            if (typeof data === 'string') {
              return normalizeProfile(JSON.parse(data));
            }
          } catch (error) {
            // Fall back to local storage below.
          }
        }

        try {
          const local = localStorage.getItem(PROFILE_STORAGE_KEY);
          if (!local) {
            return createDefaultProfile();
          }
          return normalizeProfile(JSON.parse(local));
        } catch (error) {
          return createDefaultProfile();
        }
      }

      async function safeCloudSaveProfile(profile) {
        const normalized = normalizeProfile(profile);
        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(normalized));

        if (window.ytgame && ytgame.game && typeof ytgame.game.saveData === 'function') {
          try {
            const result = ytgame.game.saveData(PROFILE_STORAGE_KEY, normalized);
            if (result && typeof result.then === 'function') {
              await result;
            }
          } catch (error) {
            // Local storage fallback is already written.
          }
        }
      }

      class GameScene extends Phaser.Scene {
        constructor() {
          super('GameScene');
        }

        init(data) {
          const incomingProfile = data && data.profile ? data.profile : createDefaultProfile();
          this.playerProfile = normalizeProfile(incomingProfile);
        }

        create() {
          this.cameras.main.setBackgroundColor('#051427');
          console.log('GameScene started');

          this.score = 0;
          this.lives = 3;
          this.combo = 0;
          this.isGameOver = false;
          this.isPaused = false;
          this.audioEnabled = safeIsAudioEnabled();
          this.bubbles = [];
          this.difficultyLevel = 1;
          this.elapsedSeconds = 0;
          this.bubbleSpeed = 120;
          this.spawnIntervalMs = 1200;
          this.bombChance = 0.1;
          this.nextSpawnAt = 0;
          this.wobbleAmplitude = 15;
          this.wobbleFrequency = 3.2;

          this.skinThemeKey = normalizeSkinKey(this.playerProfile.equippedSkin);
          this.skinTheme = SKIN_THEMES[this.skinThemeKey] || SKIN_THEMES.classic;
          this.equippedHat = this.playerProfile.equippedHat || 'none';
          this.repeatables = this.playerProfile.repeatables || {};
          const slowLevel = this.repeatables.timeWarp || 0;
          const scoreAmpLevel = this.repeatables.scoreAmp || 0;
          this.timeWarpLevel = slowLevel;
          this.timeWarpSpeedFactor = Math.max(0.4, 1 - slowLevel * 0.06);
          this.timeWarpSpawnFactor = 1 + slowLevel * 0.1;
          this.slowTimeMultiplier =
            (this.playerProfile.upgrades.slowTime ? 0.88 : 1) * this.timeWarpSpeedFactor;
          this.pointsBonusMultiplier =
            (this.playerProfile.upgrades.bonusPoints ? 1.25 : 1) * (1 + scoreAmpLevel * 0.05);

          this.levelConfigs = {
            1: { spawnIntervalMs: 1200, speed: 120, bombChance: 0.1, doubleChance: 0 },
            2: { spawnIntervalMs: 1100, speed: 135, bombChance: 0.1, doubleChance: 0 },
            3: { spawnIntervalMs: 1000, speed: 150, bombChance: 0.1, doubleChance: 0 },
            4: { spawnIntervalMs: 900, speed: 165, bombChance: 0.1, doubleChance: 0 },
            5: { spawnIntervalMs: 800, speed: 185, bombChance: 0.1, doubleChance: 0 },
            6: { spawnIntervalMs: 700, speed: 200, bombChance: 0.1, doubleChance: 0 },
            7: { spawnIntervalMs: 600, speed: 220, bombChance: 0.18, doubleChance: 0 },
            8: { spawnIntervalMs: 500, speed: 240, bombChance: 0.22, doubleChance: 0 },
            9: { spawnIntervalMs: 420, speed: 260, bombChance: 0.25, doubleChance: 0 },
            10: { spawnIntervalMs: 350, speed: 280, bombChance: 0.28, doubleChance: 0.24 }
          };

          this.createBackgroundEffects();
          this.initBubblePool();

          this.input.on('pointerdown', this.handlePointerDown, this);

          this.game.events.on('audioenabledchange', this.onAudioEnabledChange, this);

          this.applyDifficultyConfig(this.difficultyLevel, false);

          this.difficultyTimer = this.time.addEvent({
            delay: 1000,
            callback: this.onDifficultyTick,
            callbackScope: this,
            loop: true
          });

          this.emitHudUpdate();

          if (this.timeWarpLevel > 0) {
            this.showFloatingScoreText(240, 128, 'TIME WARP Lv' + this.timeWarpLevel, '#93c5fd');
          }

          this.events.once('shutdown', () => {
            this.game.events.off('audioenabledchange', this.onAudioEnabledChange, this);
            this.input.off('pointerdown', this.handlePointerDown, this);
          });
        }

        handlePointerDown(pointer) {
          if (this.isGameOver || this.isPaused) {
            return;
          }

          const px = typeof pointer.worldX === 'number' ? pointer.worldX : pointer.x;
          const py = typeof pointer.worldY === 'number' ? pointer.worldY : pointer.y;

          for (let i = this.bubbles.length - 1; i >= 0; i -= 1) {
            const bubble = this.bubbles[i];
            if (!bubble || bubble.isPopping || !bubble.typeDef) {
              continue;
            }

            const extraHitPadding = 14;
            const hitRadius = bubble.typeDef.radius + extraHitPadding;
            const dx = px - bubble.x;
            const dy = py - bubble.y;
            if (dx * dx + dy * dy <= hitRadius * hitRadius) {
              this.onBubbleTapped(bubble);
              return;
            }
          }
        }

        update(time, delta) {
          if (this.isGameOver || this.isPaused) {
            return;
          }

          const dt = delta / 1000;

          if (time >= this.nextSpawnAt) {
            this.spawnWave();
            this.nextSpawnAt = time + this.spawnIntervalMs;
          }

          for (let i = this.bubbles.length - 1; i >= 0; i -= 1) {
            const bubble = this.bubbles[i];
            if (bubble.isPopping) {
              continue;
            }

            if (bubble.vx || bubble.vy) {
              bubble.x += bubble.vx * dt;
              bubble.y += bubble.vy * dt;

              if (bubble.damping > 0) {
                const dampFactor = Math.max(0, 1 - bubble.damping * dt);
                bubble.vx *= dampFactor;
                bubble.vy *= dampFactor;
              }

              bubble.baseX = bubble.x;
            }

            bubble.age += dt;
            bubble.y -= this.bubbleSpeed * dt;
            bubble.x =
              bubble.baseX +
              Math.sin(bubble.age * this.wobbleFrequency + bubble.phase) *
                this.wobbleAmplitude * (bubble.wobbleScale || 1);

            if (bubble.y < HUD_SAFE_TOP) {
              this.onBubbleEscaped(bubble);
              this.destroyBubbleAt(i);
            }
          }
        }

        onDifficultyTick() {
          if (this.isGameOver || this.isPaused) {
            return;
          }

          this.elapsedSeconds += 1;
          const targetLevel = Math.floor(this.elapsedSeconds / 15) + 1;

          if (targetLevel > this.difficultyLevel) {
            this.difficultyLevel = targetLevel;
            this.applyDifficultyConfig(this.difficultyLevel, true);
          }

          this.emitHudUpdate();
        }

        getDifficultyConfig(level) {
          if (this.levelConfigs[level]) {
            return this.levelConfigs[level];
          }

          const extraLevels = Math.max(0, level - 10);
          return {
            spawnIntervalMs: Math.max(170, Math.floor(350 - extraLevels * 9)),
            speed: Math.floor(280 + extraLevels * 11),
            bombChance: Math.min(0.42, 0.28 + extraLevels * 0.01),
            doubleChance: Math.min(0.55, 0.24 + extraLevels * 0.02)
          };
        }

        applyDifficultyConfig(level, showFlash) {
          const cfg = this.getDifficultyConfig(level);
          this.spawnIntervalMs = Math.floor(cfg.spawnIntervalMs * this.timeWarpSpawnFactor);
          this.bubbleSpeed = cfg.speed * this.slowTimeMultiplier;
          this.bombChance = cfg.bombChance;
          this.doubleChance = cfg.doubleChance;

          if (showFlash) {
            this.game.events.emit('levelup', { level: level });
            this.playLevelUpSound();
          }

          this.emitHudUpdate();
        }

        spawnWave() {
          if (this.isGameOver) {
            return;
          }

          if (this.bubbles.length >= MAX_ACTIVE_BUBBLES) {
            return;
          }

          this.spawnWeightedBubble();

          if (
            this.difficultyLevel >= 10 &&
            this.bubbles.length < MAX_ACTIVE_BUBBLES &&
            Math.random() < this.doubleChance
          ) {
            this.spawnWeightedBubble();
          }
        }

        spawnWeightedBubble() {
          const roll = Math.random();
          let type = BUBBLE_TYPES.NORMAL;
          const smallChance = 0.15;
          const splitterChance = 0.15;
          const bombChance = this.bombChance;
          const normalChance = Math.max(0, 1 - smallChance - splitterChance - bombChance);

          if (roll < normalChance) {
            type = BUBBLE_TYPES.NORMAL;
          } else if (roll < normalChance + smallChance) {
            type = BUBBLE_TYPES.SMALL;
          } else if (roll < normalChance + smallChance + splitterChance) {
            type = BUBBLE_TYPES.SPLITTER;
          } else {
            type = BUBBLE_TYPES.BOMB;
          }

          const x = Phaser.Math.Between(EDGE_PADDING, PLAY_WIDTH - EDGE_PADDING);
          const y = PLAY_HEIGHT + 40;
          this.createBubble(type, x, y);
        }

        createBubble(type, x, y, options) {
          const opts = options || {};
          if (this.bubbles.length >= MAX_ACTIVE_BUBBLES) {
            return null;
          }

          const bubble = this.acquireBubble();
          if (!bubble) {
            return null;
          }

          bubble.x = x;
          bubble.y = y;
          bubble.setVisible(true);
          bubble.setActive(true);

          const gfx = bubble.gfx;
          this.drawBubbleGraphics(gfx, type);

          bubble.setSize(type.radius * 2, type.radius * 2);

          bubble.typeDef = type;
          bubble.baseX = x;
          bubble.age = 0;
          bubble.phase = Math.random() * Math.PI * 2;
          bubble.isPopping = false;
          bubble.vx = opts.vx || 0;
          bubble.vy = opts.vy || 0;
          bubble.damping = opts.damping || 0;
          bubble.wobbleScale = typeof opts.wobbleScale === 'number' ? opts.wobbleScale : 1;
          bubble.setScale(1);
          bubble.setAlpha(1);

          this.bubbles.push(bubble);
          return bubble;
        }

        onBubbleTapped(bubble) {
          if (this.isGameOver || this.isPaused) {
            return;
          }

          const index = this.bubbles.indexOf(bubble);
          if (index === -1 || bubble.isPopping) {
            return;
          }

          const type = bubble.typeDef;
          const bubbleX = bubble.x;
          const bubbleY = bubble.y;

          if (type.key === BUBBLE_TYPES.BOMB.key) {
            this.loseLife(1);
            this.resetCombo();
            this.showFloatingScoreText(bubbleX, bubbleY, '-LIFE!', '#ef4444');
            this.cameras.main.flash(120, 255, 40, 40, false);
            this.cameras.main.shake(200, 0.008);
            this.playBombSound();
            this.playPopAndDestroy(bubble, index);
            return;
          }

          this.incrementCombo();
          const multiplier = this.getComboMultiplier();
          const totalPoints = Math.floor(type.points * multiplier * this.pointsBonusMultiplier);
          this.score += totalPoints;
          this.showFloatingScoreText(
            bubbleX,
            bubbleY,
            '+' + totalPoints,
            this.getScoreColor(type.key)
          );
          this.spawnPopParticles(bubbleX, bubbleY, this.getBubbleThemeColor(type.key));
          this.playPopSound(type.key);
          this.emitHudUpdate();

          if (type.key === BUBBLE_TYPES.SPLITTER.key) {
            this.spawnSplitterChildren(bubbleX, bubbleY);
          }

          this.playPopAndDestroy(bubble, index);
        }

        onBubbleEscaped(bubble) {
          if (
            bubble.typeDef.key === BUBBLE_TYPES.NORMAL.key ||
            bubble.typeDef.key === BUBBLE_TYPES.SPLITTER.key
          ) {
            this.loseLife(1);
            this.resetCombo();
          }
        }

        playPopAndDestroy(bubble, index) {
          bubble.isPopping = true;
          bubble.disableInteractive();

          this.tweens.add({
            targets: bubble,
            scaleX: 1.4,
            scaleY: 1.4,
            alpha: 0,
            duration: 150,
            ease: 'Quad.Out',
            onComplete: () => {
              this.destroyBubbleAt(index, bubble);
            }
          });
        }

        spawnSplitterChildren(x, y) {
          const offsets = [-20, 20];

          for (let i = 0; i < offsets.length; i += 1) {
            const drift = offsets[i];
            const spawnX = Phaser.Math.Clamp(x, EDGE_PADDING, PLAY_WIDTH - EDGE_PADDING);
            const spawnY = y + 10;

            const child = this.createBubble(BUBBLE_TYPES.SMALL, spawnX, spawnY, {
              wobbleScale: 0.65
            });

            if (!child) {
              continue;
            }

            this.tweens.add({
              targets: child,
              x: Phaser.Math.Clamp(spawnX + drift, EDGE_PADDING, PLAY_WIDTH - EDGE_PADDING),
              y: spawnY - 10,
              duration: 160,
              ease: 'Sine.Out',
              onUpdate: () => {
                child.baseX = child.x;
              }
            });
          }
        }

        showFloatingScoreText(x, y, message, color) {
          const text = this.add.text(x, y, message, {
            color: color,
            fontSize: '22px',
            fontStyle: 'bold'
          });
          text.setOrigin(0.5);

          this.tweens.add({
            targets: text,
            y: y - 42,
            alpha: 0,
            duration: 600,
            ease: 'Cubic.Out',
            onComplete: () => text.destroy()
          });
        }

        getScoreColor(typeKey) {
          const palette = this.skinTheme && this.skinTheme.colors ? this.skinTheme.colors : SKIN_THEMES.classic.colors;
          if (typeKey === BUBBLE_TYPES.NORMAL.key) {
            return '#' + palette.NORMAL.toString(16).padStart(6, '0');
          }
          if (typeKey === BUBBLE_TYPES.SMALL.key) {
            return '#' + palette.SMALL.toString(16).padStart(6, '0');
          }
          return '#' + palette.SPLITTER.toString(16).padStart(6, '0');
        }

        getBubbleThemeColor(typeKey) {
          const palette = this.skinTheme && this.skinTheme.colors ? this.skinTheme.colors : SKIN_THEMES.classic.colors;
          return palette[typeKey] || BUBBLE_TYPES.NORMAL.color;
        }

        incrementCombo() {
          this.combo += 1;
          if (this.combo === 5) {
            this.cameras.main.flash(70, 255, 230, 140, false);
            this.playComboThresholdSound(5);
          } else if (this.combo === 10) {
            this.cameras.main.flash(80, 255, 185, 120, false);
            this.playComboThresholdSound(10);
          } else if (this.combo === 20) {
            this.cameras.main.flash(90, 198, 160, 255, false);
            this.playComboThresholdSound(20);
          }
          this.emitHudUpdate();
        }

        resetCombo() {
          this.combo = 0;
          this.emitHudUpdate();
        }

        getComboMultiplier() {
          if (this.combo >= 20) {
            return 5;
          }
          if (this.combo >= 10) {
            return 3;
          }
          if (this.combo >= 5) {
            return 2;
          }
          return 1;
        }

        loseLife(amount) {
          this.lives = Math.max(0, this.lives - amount);
          this.emitHudUpdate();

          if (this.lives <= 0) {
            this.triggerGameOver();
          }
        }

        triggerGameOver() {
          if (this.isGameOver) {
            return;
          }

          this.isGameOver = true;
          if (this.difficultyTimer) {
            this.difficultyTimer.remove(false);
          }

          for (let i = this.bubbles.length - 1; i >= 0; i -= 1) {
            this.destroyBubbleAt(i);
          }

          this.playGameOverSound();

          this.game.events.emit('gameover', {
            finalScore: this.score,
            coinsEarned: this.calculateCoinsEarned()
          });
        }

        calculateCoinsEarned() {
          const scoreCoins = Math.floor(this.score / 20);
          const survivalCoins = Math.floor(this.elapsedSeconds / 10);
          const coinEngineLevel = this.repeatables && this.repeatables.coinEngine ? this.repeatables.coinEngine : 0;
          const boosted = Math.floor((scoreCoins + survivalCoins) * (1 + coinEngineLevel * 0.2));
          return Math.max(1, boosted);
        }

        setPaused(paused) {
          this.isPaused = paused;
          if (this.difficultyTimer) {
            this.difficultyTimer.paused = paused;
          }

          if (paused) {
            this.tweens.pauseAll();
          } else {
            this.tweens.resumeAll();
          }
        }

            this.tweens.add({

            });

        spawnPopParticles(x, y, color) {
          const count = Phaser.Math.Between(6, 8);
          for (let i = 0; i < count; i += 1) {
            const particle = this.add.circle(x, y, Phaser.Math.Between(3, 6), color, 0.9);
            const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
            const distance = Phaser.Math.Between(16, 42);

            this.tweens.add({
              targets: particle,
              x: x + Math.cos(angle) * distance,
              y: y + Math.sin(angle) * distance,
              alpha: 0,

              duration: Phaser.Math.Between(420, 760),
              ease: 'Cubic.Out',
              onComplete: () => particle.destroy()
            });
          }
        }

        onAudioEnabledChange(enabled) {
          this.audioEnabled = !!enabled;
        }

        playPopSound(typeKey) {
          let base = 500;
          if (typeKey === BUBBLE_TYPES.SMALL.key) {
            base = 720;
          } else if (typeKey === BUBBLE_TYPES.SPLITTER.key) {
            base = 580;
          }

          this.playTone(base, 0.07, 'sine', 0.06, 0);
        }

        playBombSound() {
          this.playTone(120, 0.18, 'triangle', 0.1, 0);
          this.playTone(68, 0.22, 'sawtooth', 0.08, 0.02);
        }

        playComboThresholdSound(threshold) {
          if (threshold === 5) {
            this.playTone(520, 0.08, 'sine', 0.07, 0);
            this.playTone(620, 0.08, 'sine', 0.07, 0.08);
          } else if (threshold === 10) {
            this.playTone(560, 0.08, 'sine', 0.08, 0);
            this.playTone(680, 0.08, 'sine', 0.08, 0.08);
            this.playTone(820, 0.1, 'sine', 0.08, 0.16);
          } else {
            this.playTone(500, 0.08, 'square', 0.07, 0);
            this.playTone(650, 0.08, 'square', 0.07, 0.08);
            this.playTone(820, 0.08, 'square', 0.07, 0.16);
            this.playTone(1040, 0.1, 'square', 0.07, 0.24);
          }
        }

        playLevelUpSound() {
          this.playTone(440, 0.08, 'sine', 0.07, 0);
          this.playTone(550, 0.08, 'sine', 0.07, 0.08);
          this.playTone(660, 0.1, 'sine', 0.07, 0.16);
        }

        playGameOverSound() {
          this.playTone(420, 0.12, 'triangle', 0.08, 0);
          this.playTone(320, 0.12, 'triangle', 0.08, 0.12);
          this.playTone(220, 0.16, 'triangle', 0.08, 0.24);
          this.playTone(140, 0.22, 'sawtooth', 0.07, 0.4);
        }

        playTone(freq, duration, type, volume, delay) {
          if (!this.audioEnabled || !this.sound || !this.sound.context) {
            return;
          }

          const ctx = this.sound.context;
          const now = ctx.currentTime + (delay || 0);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume || 0.07), now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        }

        emitHudUpdate() {
          this.game.events.emit('hudupdate', {
            lives: this.lives,
            score: this.score,
            combo: this.combo,
            multiplier: this.getComboMultiplier(),
            level: this.difficultyLevel,
            elapsedSeconds: this.elapsedSeconds
          });
        }

        destroyBubbleAt(index, expectedBubble) {
          if (index < 0 || index >= this.bubbles.length) {
            return;
          }

          const bubble = this.bubbles[index];
          if (!bubble) {
            return;
          }

          if (expectedBubble && bubble !== expectedBubble) {
            const resolvedIndex = this.bubbles.indexOf(expectedBubble);
            if (resolvedIndex === -1) {
              return;
            }
            this.destroyBubbleAt(resolvedIndex);
            return;
          }

          this.releaseBubble(bubble);
          this.bubbles.splice(index, 1);
        }

        initBubblePool() {
          this.bubblePool = [];
          for (let i = 0; i < BUBBLE_POOL_SIZE; i += 1) {
            const container = this.add.container(-9999, -9999);
            const gfx = this.add.graphics();
            container.add(gfx);
            container.gfx = gfx;
            container.inUse = false;
            container.setVisible(false);
            container.setActive(false);
            this.bubblePool.push(container);
          }
        }

        acquireBubble() {
          for (let i = 0; i < this.bubblePool.length; i += 1) {
            if (!this.bubblePool[i].inUse) {
              this.bubblePool[i].inUse = true;
              return this.bubblePool[i];
            }
          }
          return null;
        }

        releaseBubble(bubble) {
          bubble.disableInteractive();
          bubble.setVisible(false);
          bubble.setActive(false);
          bubble.x = -9999;
          bubble.y = -9999;
          bubble.inUse = false;
        }

        drawBubbleGraphics(gfx, type) {
          gfx.clear();

          const palette = this.skinTheme && this.skinTheme.colors ? this.skinTheme.colors : SKIN_THEMES.classic.colors;
          const bubbleColor = palette[type.key] || type.color;

          gfx.fillStyle(bubbleColor, 0.78);
          gfx.fillCircle(0, 0, type.radius);

          gfx.lineStyle(2, 0xffffff, 0.22);
          gfx.strokeCircle(0, 0, type.radius - 1);

          gfx.fillStyle(0xffffff, 0.35);
          gfx.fillCircle(-type.radius * 0.34, -type.radius * 0.34, Math.max(6, type.radius * 0.26));

          gfx.fillStyle(0xffffff, 0.12);
          gfx.fillCircle(type.radius * 0.18, type.radius * 0.22, Math.max(4, type.radius * 0.15));

          if (type.key === BUBBLE_TYPES.BOMB.key) {
            gfx.lineStyle(4, 0xffffff, 1);
            const xSize = type.radius * 0.45;
            gfx.lineBetween(-xSize, -xSize, xSize, xSize);
            gfx.lineBetween(-xSize, xSize, xSize, -xSize);
          }

          if (this.skinThemeKey !== 'classic') {
            gfx.lineStyle(3, bubbleColor, 0.65);
            gfx.strokeCircle(0, 0, type.radius + 3);
          }

          if (this.equippedHat === 'crown') {
            gfx.fillStyle(0xfbbf24, 0.95);
            gfx.fillTriangle(
              -type.radius * 0.45,
              -type.radius * 1.08,
              0,
              -type.radius * 1.45,
              type.radius * 0.45,
              -type.radius * 1.08
            );
            gfx.fillRect(-type.radius * 0.5, -type.radius * 1.08, type.radius, type.radius * 0.16);
          } else if (this.equippedHat === 'halo') {
            gfx.lineStyle(3, 0xfef08a, 0.9);
            gfx.strokeEllipse(0, -type.radius * 1.08, type.radius * 1.05, type.radius * 0.34);
          } else if (this.equippedHat === 'propeller') {
            gfx.fillStyle(0x94a3b8, 0.95);
            gfx.fillRect(-2, -type.radius * 1.22, 4, type.radius * 0.3);
            gfx.fillStyle(0xf87171, 0.95);
            gfx.fillEllipse(-type.radius * 0.28, -type.radius * 1.23, type.radius * 0.5, type.radius * 0.18);
            gfx.fillStyle(0x60a5fa, 0.95);
            gfx.fillEllipse(type.radius * 0.28, -type.radius * 1.23, type.radius * 0.5, type.radius * 0.18);
          }
        }
      }

            scrollHint,
            this.shopPrevButton,
            this.shopPrevButton.label,
            this.shopPageText,
            this.shopNextButton,
            this.shopNextButton.label,
            closeButton,
            closeButton.label
          ]);

          for (let i = 0; i < this.shopButtons.length; i += 1) {
            const entry = this.shopButtons[i];
            this.shopContainer.add([entry.button, entry.button.label, entry.subtitle]);
          }

          this.updateShopPagination();

          this.shopContainer.setVisible(false);
        }

        openShop() {
          if (this.shopContainer) {
            this.refreshShopButtons();
            this.setShopPage(0);
            this.shopContainer.setVisible(true);
          }
        }

        closeShop() {
          if (this.shopContainer) {
            this.shopContainer.setVisible(false);
          }
        }

        getShopTotalPages() {
          if (!this.shopButtons || this.shopButtons.length === 0) {
            return 1;
          }
          return Math.max(1, Math.ceil(this.shopButtons.length / this.shopPageSize));
        }

        setShopPage(nextPage) {
          const totalPages = this.getShopTotalPages();
          this.shopPage = Phaser.Math.Clamp(nextPage, 0, totalPages - 1);
          this.updateShopPagination();
        }

        updateShopPagination() {
          if (!this.shopButtons) {
            return;
          }

          const totalPages = this.getShopTotalPages();
          const start = this.shopPage * this.shopPageSize;
          const end = start + this.shopPageSize;

          for (let i = 0; i < this.shopButtons.length; i += 1) {
            const entry = this.shopButtons[i];
            const onPage = i >= start && i < end;

            entry.button.setVisible(onPage);
            entry.button.label.setVisible(onPage);
            entry.subtitle.setVisible(onPage);

            if (onPage) {
              entry.button.setInteractive({ useHandCursor: true });
              const localIndex = i - start;
              const col = localIndex % 2;
              const row = Math.floor(localIndex / 2);
              const slotX = col === 0 ? 136 : 344;
              const slotY = 220 + row * 80;
              entry.button.setPosition(slotX, slotY);
              entry.button.label.setPosition(slotX, slotY - 9);
              entry.subtitle.setPosition(slotX, slotY + 12);
            } else {
              entry.button.disableInteractive();
            }
          }

          if (this.shopPageText) {
            this.shopPageText.setText('Page ' + (this.shopPage + 1) + '/' + totalPages);
          }

          const canPrev = this.shopPage > 0;
          const canNext = this.shopPage < totalPages - 1;

          if (this.shopPrevButton) {
            this.shopPrevButton.setAlpha(canPrev ? 1 : 0.45);
            this.shopPrevButton.label.setAlpha(canPrev ? 1 : 0.45);
            if (canPrev) {
              this.shopPrevButton.setInteractive({ useHandCursor: true });
            } else {
              this.shopPrevButton.disableInteractive();
            }
          }

          if (this.shopNextButton) {
            this.shopNextButton.setAlpha(canNext ? 1 : 0.45);
            this.shopNextButton.label.setAlpha(canNext ? 1 : 0.45);
            if (canNext) {
              this.shopNextButton.setInteractive({ useHandCursor: true });
            } else {
              this.shopNextButton.disableInteractive();
            }
          }
        }

        createShopButton(x, y, item) {
          const button = this.createButton(x, y, item.label, {
            width: 182,
            height: 52,
            fontSize: '15px',
            labelYOffset: -9
          });

          const subtitle = this.add.text(x, y + 12, '', {
            color: '#cbd5e1',
            fontSize: '12px',
            fontStyle: 'bold'
          });
          subtitle.setOrigin(0.5);

          button.on('pointerdown', () => {
            this.handleShopPurchase(item);
          });

          return { item: item, button: button, subtitle: subtitle };
        }

        handleShopPurchase(item) {
          if (!item) {
            return;
          }

          const profile = this.playerProfile;
          let changed = false;

          if (item.type === 'upgrade') {
            if (!profile.upgrades[item.value]) {
              if (profile.coins < item.cost) {
                return;
              }
              profile.coins -= item.cost;
              profile.upgrades[item.value] = true;
              changed = true;
            }
          } else if (item.type === 'repeatable') {
            const level = profile.repeatables[item.value] || 0;
            const cost = this.getRepeatableCost(item, level);
            if (profile.coins < cost) {
              return;
            }
            profile.coins -= cost;
            profile.repeatables[item.value] = level + 1;
            changed = true;
          } else if (item.type === 'skin') {
            const isOwned = profile.ownedSkins.includes(item.value);
            if (!isOwned) {
              if (profile.coins < item.cost) {
                return;
              }
              profile.coins -= item.cost;
              profile.ownedSkins.push(item.value);
              changed = true;
            }

            if (profile.equippedSkin !== item.value) {
              profile.equippedSkin = item.value;
              changed = true;
            }
          } else if (item.type === 'hat') {
            const isOwned = profile.ownedHats.includes(item.value);
            if (!isOwned) {
              if (profile.coins < item.cost) {
                return;
              }
              profile.coins -= item.cost;
              profile.ownedHats.push(item.value);
              changed = true;
            }

            if (profile.equippedHat !== item.value) {
              profile.equippedHat = item.value;
              changed = true;
            }
          }

          if (changed) {
            this.playerProfile = normalizeProfile(profile);
            this.refreshShopButtons();
            this.savePlayerProfile();
          }
        }

        getShopStatus(item) {
          if (item.type === 'upgrade') {
            if (this.playerProfile.upgrades[item.value]) {
              return 'OWNED';
            }
            return 'BUY ' + item.cost;
          }

          if (item.type === 'repeatable') {
            const level = this.playerProfile.repeatables[item.value] || 0;
            const cost = this.getRepeatableCost(item, level);
            return 'LV ' + level + ' BUY ' + cost;
          }

          if (item.type === 'skin') {
            if (!this.playerProfile.ownedSkins.includes(item.value)) {
              return 'BUY ' + item.cost;
            }
            if (this.playerProfile.equippedSkin === item.value) {
              return 'ACTIVE';
            }
            return 'EQUIP';
          }

          if (!this.playerProfile.ownedHats.includes(item.value)) {
            return 'BUY ' + item.cost;
          }
          if (this.playerProfile.equippedHat === item.value) {
            return 'ACTIVE';
          }
          return 'EQUIP';
        }

        getRepeatableCost(item, level) {
          return Math.floor(item.baseCost * Math.pow(item.growth, level));
        }

        refreshShopButtons() {
          if (this.shopCoinsText) {
            this.shopCoinsText.setText('Coins: ' + this.playerProfile.coins);
          }

          if (this.equippedSummaryText) {
            const skinName = SKIN_THEMES[this.playerProfile.equippedSkin]
              ? SKIN_THEMES[this.playerProfile.equippedSkin].name
              : 'Classic';
            const hatName = this.playerProfile.equippedHat === 'none'
              ? 'No Hat'
              : this.playerProfile.equippedHat === 'crown'
                ? 'Crown'
                : this.playerProfile.equippedHat === 'halo'
                  ? 'Halo'
                  : 'Propeller';
            this.equippedSummaryText.setText('Equipped: ' + skinName + ' / ' + hatName);
          }

          if (!this.shopButtons) {
            return;
          }

          for (let i = 0; i < this.shopButtons.length; i += 1) {
            const entry = this.shopButtons[i];
            entry.subtitle.setText(this.getShopStatus(entry.item));
          }

          this.updateShopPagination();
        }

        createGameOverOverlay() {
          this.gameOverContainer = this.add.container(0, 0);
          const dim = this.add.rectangle(240, 320, 480, 640, 0x000000, 0.7);
          const overTitle = this.add.text(240, 196, 'GAME OVER', {
            color: '#ef4444',
            fontSize: '64px',
            fontStyle: 'bold'
          });
          overTitle.setOrigin(0.5);

          this.finalScoreText = this.add.text(240, 274, 'Final: 0', {
            color: '#ffffff',
            fontSize: '34px'
          });
          this.finalScoreText.setOrigin(0.5);

          this.bestScoreText = this.add.text(240, 318, 'Best: 0', {
            color: '#fbbf24',
            fontSize: '30px',
            fontStyle: 'bold'
          });
          this.bestScoreText.setOrigin(0.5);

          this.coinsEarnedText = this.add.text(240, 354, 'Coins Earned: +0', {
            color: '#86efac',
            fontSize: '28px',
            fontStyle: 'bold'
          });
          this.coinsEarnedText.setOrigin(0.5);

          this.newBestText = this.add.text(240, 390, 'NEW BEST! 🏆', {
            color: '#fbbf24',
            fontSize: '30px',
            fontStyle: 'bold'
          });
          this.newBestText.setOrigin(0.5);
          this.newBestText.setVisible(false);

          const playAgain = this.createButton(240, 458, 'PLAY AGAIN');
          playAgain.on('pointerdown', () => {
            this.startGame();
          });

          const mainMenu = this.createButton(240, 528, 'MAIN MENU');
          mainMenu.on('pointerdown', () => {
            this.showMainMenu();
          });

          this.gameOverContainer.add([
            dim,
            overTitle,
            this.finalScoreText,
            this.bestScoreText,
            this.coinsEarnedText,
            this.newBestText,
            playAgain,
            playAgain.label,
            mainMenu,
            mainMenu.label
          ]);
          this.gameOverContainer.setVisible(false);
        }

        createPauseOverlay() {
          this.pauseOverlay = this.add.container(0, 0);
          const dim = this.add.rectangle(240, 320, 480, 640, 0x000000, 0.55);
          const label = this.add.text(240, 320, 'PAUSED', {
            color: '#ffffff',
            fontSize: '68px',
            fontStyle: 'bold'
          });
          label.setOrigin(0.5);
          this.pauseOverlay.add([dim, label]);
          this.pauseOverlay.setDepth(1000);
          this.pauseOverlay.setVisible(false);
        }

        createButton(x, y, text, options) {
          const opts = options || {};
          const width = opts.width || 240;
          const height = opts.height || 56;
          const fontSize = opts.fontSize || '28px';
          const labelYOffset = opts.labelYOffset || 0;

          const button = this.add
            .rectangle(x, y, width, height, 0x1f2937, 0.95)
            .setStrokeStyle(2, 0xffffff, 1)
            .setInteractive({ useHandCursor: true });
          const label = this.add.text(x, y + labelYOffset, text, {
            color: '#ffffff',
            fontSize: fontSize,
            fontStyle: 'bold'
          });
          label.setOrigin(0.5);
          button.label = label;

          button.on('pointerover', () => {
            button.fillColor = 0x374151;
          });
          button.on('pointerout', () => {
            button.fillColor = 0x1f2937;
          });
          return button;
        }

        startGame() {
          this.closeShop();
          this.menuContainer.setVisible(false);
          this.gameOverContainer.setVisible(false);
          this.hudContainer.setVisible(true);
          this.decorSpawnTimer.paused = true;
          this.clearDecorBubbles();

          if (this.scene.isActive('GameScene')) {
            this.scene.stop('GameScene');
          }
          this.scene.launch('GameScene', { profile: this.playerProfile });
        }

        showMainMenu() {
          this.closeShop();
          this.menuBestText.setText('Best: ' + this.bestScore);
          this.refreshShopButtons();
          this.menuContainer.setVisible(true);
          this.gameOverContainer.setVisible(false);
          this.hudContainer.setVisible(false);

          if (this.scene.isActive('GameScene')) {
            this.scene.stop('GameScene');
          }

          this.decorSpawnTimer.paused = false;

          if (!this.gameReadySent) {
            this.gameReadySent = true;
            this.time.delayedCall(0, () => {
              safeGameReady();
            });
          }
        }

        handlePause() {
          if (this.isPausedState) {
            return;
          }
          this.isPausedState = true;
          this.pauseOverlay.setVisible(true);

          if (this.scene.isActive('GameScene')) {
            const gameScene = this.scene.get('GameScene');
            if (gameScene && typeof gameScene.setPaused === 'function') {
              gameScene.setPaused(true);
            }
          }

          this.decorSpawnTimer.paused = true;
          this.tweens.pauseAll();
        }

        handleResume() {
          if (!this.isPausedState) {
            return;
          }

          this.isPausedState = false;
          this.pauseOverlay.setVisible(false);
          this.tweens.resumeAll();

          if (this.scene.isActive('GameScene')) {
            const gameScene = this.scene.get('GameScene');
            if (gameScene && typeof gameScene.setPaused === 'function') {
              gameScene.setPaused(false);
            }
          }

          if (this.menuContainer.visible) {
            this.decorSpawnTimer.paused = false;
          }
        }

        onHudUpdate(data) {
          if (!this.hudContainer.visible) {
            return;
          }

          if (typeof data.lives === 'number' && data.lives < this.lastHudLives) {
            for (let i = data.lives; i < this.lastHudLives; i += 1) {
              if (this.lifeIcons[i]) {
                this.animateLifeLossIcon(this.lifeIcons[i]);
              }
            }
          }

          for (let i = 0; i < this.lifeIcons.length; i += 1) {
            if (i < data.lives) {
              this.lifeIcons[i].setAlpha(1);
              this.lifeIcons[i].setScale(1);
            } else {
              this.lifeIcons[i].setAlpha(0.22);
              this.lifeIcons[i].setScale(0.95);
            }
          }

          this.scoreHud.setText(String(data.score));
          this.levelHud.setText('Lv ' + data.level);
          this.timerHud.setText(this.formatTime(data.elapsedSeconds));

          if (data.combo >= 5) {
            this.comboHud.setText('COMBO x' + data.combo + '!');
            this.comboHud.setVisible(true);
          } else {
            this.comboHud.setVisible(false);
          }

          this.lastHudLives = data.lives;
        }

        onLevelUp() {
          if (!this.hudContainer.visible) {
            return;
          }

          const levelFlash = this.add.text(240, 300, 'LEVEL UP! ⬆️', {
            color: '#f8fafc',
            fontSize: '34px',
            fontStyle: 'bold'
          });
          levelFlash.setOrigin(0.5);

          this.tweens.add({
            targets: levelFlash,
            alpha: 0,
            y: 260,
            duration: 560,
            ease: 'Cubic.Out',
            onComplete: () => levelFlash.destroy()
          });
        }

        onGameOver(payload) {
          const finalScore = payload.finalScore || 0;
          const coinsEarned = payload.coinsEarned || 0;
          this.hudContainer.setVisible(false);
          this.gameOverContainer.setVisible(true);

          let isNewBest = false;
          if (finalScore > this.bestScore) {
            this.bestScore = finalScore;
            safeCloudSaveBestScore(this.bestScore);
            isNewBest = true;
          }

          this.finalScoreText.setText('Final: ' + finalScore);
          this.bestScoreText.setText('Best: ' + this.bestScore);
          this.coinsEarnedText.setText('Coins Earned: +' + coinsEarned);
          this.newBestText.setVisible(isNewBest);

          if (coinsEarned > 0) {
            this.playerProfile.coins += coinsEarned;
            this.playerProfile = normalizeProfile(this.playerProfile);
            this.refreshShopButtons();
            this.savePlayerProfile();
          }

          safeSendScore(finalScore);
        }

        async loadPlayerProfile() {
          this.playerProfile = await safeCloudLoadProfile();
          this.refreshShopButtons();
        }

        async savePlayerProfile() {
          await safeCloudSaveProfile(this.playerProfile);
        }

        async loadBestScoreFromCloud() {
          this.bestScore = await safeCloudLoadBestScore();
          if (this.menuBestText) {
            this.menuBestText.setText('Best: ' + this.bestScore);
          }
          if (this.bestScoreText) {
            this.bestScoreText.setText('Best: ' + this.bestScore);
          }
        }

        formatTime(totalSeconds) {
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          const mm = String(minutes).padStart(2, '0');
          const ss = String(seconds).padStart(2, '0');
          return mm + ':' + ss;
        }
      }

      const config = {
        type: Phaser.AUTO,
        parent: 'game-root',
        width: 480,
        height: 640,
        scene: [BootScene, GameScene, UIScene],
        scale: {
          mode: Phaser.Scale.FIT,
          autoCenter: Phaser.Scale.CENTER_BOTH
        }
      };

      new Phaser.Game(config);
    </script>
  </body>
</html>
